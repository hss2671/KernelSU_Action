name: Build Kernel ticwatchpro3

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Config file to build (path, relative to the repo root)"
        required: false
        default: "config/ticwatchpro3.env"
        type: string

      ksu_variant:
        description: "KernelSU variant"
        required: false
        default: "config"
        type: choice
        options:
          - config
          - none
          - kernelsu
          - kernelsu-next
          - sukisu-ultra
          - resukisu
          - rsuntk
          - backslashxx

      ksu_ref:
        description: "KernelSU branch/tag/commit (blank = best default for your kernel)"
        required: false
        default: ""
        type: string

      hook_mode:
        description: "Syscall hook mechanism"
        required: false
        default: "config"
        type: choice
        options:
          - config
          - auto
          - kprobes
          - manual
          - tracepoint
          - syscall
          - none

      susfs:
        description: "Apply SUSFS (mount/root hiding)"
        required: false
        default: "config"
        type: choice
        options:
          - config
          - "true"
          - "false"

      path_umount:
        description: "Backport path_umount() (needed on kernels older than 5.9)"
        required: false
        default: "config"
        type: choice
        options:
          - config
          - "true"
          - "false"

      hide_stuff:
        description: "Apply hide_stuff (extra fingerprint removal)"
        required: false
        default: "config"
        type: choice
        options:
          - config
          - "true"
          - "false"

      kpm:
        description: "Enable KPM (SukiSU-Ultra only)"
        required: false
        default: "config"
        type: choice
        options:
          - config
          - "true"
          - "false"

      extra_defconfig:
        description: "Extra defconfig lines, space separated (e.g. CONFIG_TMPFS_XATTR=y)"
        required: false
        default: ""
        type: string

      publish_release:
        description: "Publish the build as a GitHub Release"
        required: false
        default: false
        type: boolean

  workflow_call:
    inputs:
      config:
        required: false
        default: "config.env"
        type: string
      ksu_variant:
        required: false
        default: "config"
        type: string
      ksu_ref:
        required: false
        default: ""
        type: string
      hook_mode:
        required: false
        default: "config"
        type: string
      susfs:
        required: false
        default: "config"
        type: string
      path_umount:
        required: false
        default: "config"
        type: string
      hide_stuff:
        required: false
        default: "config"
        type: string
      kpm:
        required: false
        default: "config"
        type: string
      extra_defconfig:
        required: false
        default: ""
        type: string
      publish_release:
        required: false
        default: false
        type: boolean

concurrency:
  group: build-kernel-${{ github.ref }}-${{ inputs.config }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.config }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    outputs:
      device: ${{ steps.meta.outputs.device }}
      build_time: ${{ steps.meta.outputs.build_time }}
      ksu_name: ${{ steps.meta.outputs.ksu_name }}
      ksu_version: ${{ steps.meta.outputs.ksu_version }}
      kernel_release: ${{ steps.meta.outputs.kernel_release }}
      susfs_version: ${{ steps.meta.outputs.susfs_version }}

    env:
      WORKSPACE: ${{ github.workspace }}/kernel_workspace
      CONFIG_ENV: ${{ inputs.config }}

      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

      # Force the legacy 4.9 kernel's Clang compiler into ARM target mode.
      #
      # CLANG_TRIPLE is used by the kernel build system for the
      # cross-toolchain prefix, but it does not by itself change
      # Clang's compilation target.
      #
      # Without this, cc-option() in arch/arm/Makefile is evaluated
      # using Clang's native x86 target and incorrectly falls back to
      # -march=armv5t.
      KCFLAGS: "--target=arm-linux-androideabi"

      # workflow inputs -> IN_* overrides consumed by scripts/config.sh
      IN_KSU_VARIANT: ${{ inputs.ksu_variant }}
      IN_KSU_REF: ${{ inputs.ksu_ref }}
      IN_KSU_HOOK_MODE: ${{ inputs.hook_mode }}
      IN_ENABLE_SUSFS: ${{ inputs.susfs }}
      IN_ENABLE_PATH_UMOUNT: ${{ inputs.path_umount }}
      IN_ENABLE_HIDE_STUFF: ${{ inputs.hide_stuff }}
      IN_ENABLE_KPM: ${{ inputs.kpm }}
      IN_EXTRA_DEFCONFIG: ${{ inputs.extra_defconfig }}

    steps:

      # ==============================================================
      # Source
      # ==============================================================

      - uses: actions/checkout@v4

      - name: Resolve configuration
        run: bash scripts/config.sh

      # ==============================================================
      # Runner
      # ==============================================================

      - name: Free up disk space
        if: env.REMOVE_UNUSED_PACKAGES == 'true'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Add swap space
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq

          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ccache \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lz4 \
            make \
            python3 \
            rsync \
            unzip \
            zip \
            zstd \
            libncurses-dev

          mkdir -p "$WORKSPACE"

      # ==============================================================
      # Toolchain / kernel source
      # ==============================================================

      - name: Set up toolchain
        run: bash scripts/toolchain.sh

      # ==============================================================
      # Debug actual downloaded Clang
      #
      # IMPORTANT:
      # Do not use `command -v clang` here before build.sh.
      #
      # build.sh adds CLANG_PATH to PATH inside build_kernel().
      # At this point that has not happened yet.
      #
      # Therefore this step directly invokes:
      #
      #   ${CLANG_PATH}/clang
      #
      # This step does not modify compiler flags or the kernel source.
      # ==============================================================

      - name: Debug downloaded Clang
        run: |
          set -e

          echo "===== CLANG_PATH ====="
          echo "${CLANG_PATH}"

          echo
          echo "===== KCFLAGS ====="
          echo "${KCFLAGS}"

          CLANG_BIN="${CLANG_PATH}/clang"

          echo
          echo "===== Clang binary ====="
          ls -l "${CLANG_BIN}"
          readlink -f "${CLANG_BIN}"

          echo
          echo "===== Clang version ====="
          "${CLANG_BIN}" --version

          echo
          echo "===== Clang dumpmachine ====="
          "${CLANG_BIN}" -dumpmachine

          echo
          echo "===== Clang target help: ARM ====="
          "${CLANG_BIN}" -target-help | grep -iE 'arm|aarch' | head -100 || true

          echo
          echo "===== Direct ARM target test ====="
          "${CLANG_BIN}" \
            --target=arm-linux-androideabi \
            -mcpu=armv5t \
            -c /dev/null \
            -o /tmp/armv5t-test.o

          echo
          echo "===== Direct ARM target test result ====="
          file /tmp/armv5t-test.o

          echo
          echo "===== ARM target test through KCFLAGS ====="
          "${CLANG_BIN}" \
            ${KCFLAGS} \
            -mcpu=armv5t \
            -c /dev/null \
            -o /tmp/armv5t-kcflags-test.o

          echo
          echo "===== ARM target test through KCFLAGS result ====="
          file /tmp/armv5t-kcflags-test.o

          echo
          echo "===== PATH lookup after adding CLANG_PATH ====="
          export PATH="${CLANG_PATH}:${PATH}"

          command -v clang
          readlink -f "$(command -v clang)"

          echo
          echo "===== clang selected through PATH ====="
          clang --version

          echo
          echo "===== clang selected through PATH: dumpmachine ====="
          clang -dumpmachine

      - name: Fetch kernel source
        run: bash scripts/source.sh

      # ==============================================================
      # Debug ARM kernel CPU flags
      #
      # This runs against the original kernel source before KernelSU
      # injection and kernel patches.
      #
      # It does not modify the kernel source.
      #
      # The purpose is to identify the exact source of:
      #
      #   -mcpu=armv5t
      #
      # without guessing or changing it.
      # ==============================================================

      - name: Debug ARM kernel CPU flags
        run: |
          set -e

          KERNEL_DIR="$WORKSPACE/android-kernel"

          echo "===== Kernel source ====="
          echo "$KERNEL_DIR"

          cd "$KERNEL_DIR"

          echo
          echo "===== armv5t references ====="
          grep -RIn --exclude-dir=.git "armv5t" \
            arch/arm/Makefile \
            arch/arm/Kconfig \
            Makefile \
            Kbuild || true

          echo
          echo "===== -mcpu= references ====="
          grep -RIn --exclude-dir=.git -- "-mcpu=" \
            arch/arm \
            Makefile \
            Kbuild || true

          echo
          echo "===== CONFIG_CPU_ references ====="
          grep -RIn --exclude-dir=.git "CONFIG_CPU_" \
            arch/arm/Makefile \
            arch/arm/Kconfig || true

          echo
          echo "===== Relevant ARM Makefile ====="
          sed -n '1,260p' arch/arm/Makefile

          echo
          echo "===== Relevant ARM Kconfig CPU section ====="
          grep -n -B5 -A20 "config CPU_" arch/arm/Kconfig || true

      # ==============================================================
      # KernelSU
      # ==============================================================

      - name: Install KernelSU
        if: env.KSU_VARIANT != 'none'
        run: bash scripts/kernelsu.sh

      # ==============================================================
      # KernelSU / kernel patches
      # ==============================================================

      - name: Apply kernel patches
        run: bash scripts/patches.sh all

      # ==============================================================
      # Fix legacy ARM kernel Clang flags
      #
      # Clang r450784e used by this 4.9 ARM kernel does not support:
      #
      #   -Wno-undefined-optimized
      #   -Wno-vectorizer-no-neon
      #
      # The kernel Makefiles add these flags and Clang treats the unknown
      # warning options as errors. Remove only these two exact entries.
      # ==============================================================

      - name: Fix Clang flags for legacy ARM kernel
        run: |
          set -e

          KERNEL_DIR="$WORKSPACE/android-kernel"

          echo "Kernel source: $KERNEL_DIR"

          cd "$KERNEL_DIR"

          echo "Checking unsupported Clang flags before patch..."

          grep -n \
            -e 'Wno-undefined-optimized' \
            -e 'Wno-vectorizer-no-neon' \
            Makefile arch/arm/Makefile || true

          echo "Removing unsupported Clang warning flags..."

          sed -i \
            '/^[[:space:]]*KBUILD_CFLAGS[[:space:]]*+=[[:space:]]*-Wno-undefined-optimized[[:space:]]*$/d' \
            Makefile

          sed -i \
            '/^[[:space:]]*KBUILD_CFLAGS[[:space:]]*+=[[:space:]]*-Wno-vectorizer-no-neon[[:space:]]*$/d' \
            arch/arm/Makefile

          echo "Checking unsupported Clang flags after patch..."

          if grep -n \
            -e 'Wno-undefined-optimized' \
            -e 'Wno-vectorizer-no-neon' \
            Makefile arch/arm/Makefile; then

            echo "ERROR: unsupported Clang flags are still present."
            exit 1
          fi

          echo "Clang flag cleanup completed successfully."

      # ==============================================================
      # ccache
      # ==============================================================

      - name: Set up ccache
        if: env.ENABLE_CCACHE == 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-${{ env.DEVICE }}-${{ env.KSU_VARIANT }}-${{ env.KERNEL_VERSION }}
          max-size: 2G

      # ==============================================================
      # Build
      # ==============================================================

      - name: Build kernel
        run: |
          echo "===== Kernel compiler target ====="
          echo "KCFLAGS=${KCFLAGS}"

          echo
          echo "===== Clang target verification ====="
          "${CLANG_PATH}/clang" \
            ${KCFLAGS} \
            -dumpmachine

          echo
          echo "===== Build kernel ====="
          bash scripts/build.sh all

      # ==============================================================
      # Package
      # ==============================================================

      - name: Package artifacts
        run: bash scripts/package.sh all

      # ==============================================================
      # Metadata
      # ==============================================================

      - name: Export build metadata
        id: meta
        run: |
          {
            echo "device=${DEVICE}"
            echo "build_time=${BUILD_TIME}"
            echo "ksu_name=${KSU_NAME:-none}"
            echo "ksu_version=${KSU_VERSION_LABEL:-}"
            echo "kernel_release=${KERNEL_RELEASE:-}"
            echo "susfs_version=${SUSFS_VERSION:-}"
          } >> "$GITHUB_OUTPUT"

      # ==============================================================
      # Artifacts
      # ==============================================================

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_IMAGE_NAME }}${{ env.LOCALVERSION }}${{ env.UPLOADNAME }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
          path: kernel_workspace/android-kernel/out/arch/${{ env.ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }}
          if-no-files-found: error

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3${{ env.LOCALVERSION }}${{ env.UPLOADNAME }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
          path: kernel_workspace/AnyKernel3/*
          if-no-files-found: error

      - name: Upload DTBO image
        if: env.CHECK_DTBO_IS_OK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dtbo-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
          path: kernel_workspace/android-kernel/out/arch/${{ env.ARCH }}/boot/dtbo.img

      - name: Upload boot image
        if: env.MAKE_BOOT_IMAGE_IS_OK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: boot${{ env.LOCALVERSION }}${{ env.UPLOADNAME }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
          path: kernel_workspace/boot.img

  # ================================================================
  # Release
  # ================================================================

  release:
    name: Publish release
    needs: build
    if: inputs.publish_release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Package AnyKernel3 as a flashable zip
        run: |
          mkdir -p release
          shopt -s nullglob

          for dir in artifacts/AnyKernel3*/; do
            name=$(basename "${dir%/}")

            (
              cd "$dir"
              zip -qr9 "${GITHUB_WORKSPACE}/release/${name}.zip" .
            )

            echo "packed ${name}.zip"
          done

          for f in \
            artifacts/*/Image* \
            artifacts/*/boot.img \
            artifacts/*/dtbo.img; do

            [ -f "$f" ] && cp "$f" release/
          done

          ls -la release/

      - name: Create release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107633cd2f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: ${{ needs.build.outputs.device }}-${{ needs.build.outputs.build_time }}

          name: ${{ needs.build.outputs.device }} · ${{ needs.build.outputs.ksu_name }} · ${{ needs.build.outputs.build_time }}

          body: |
            | | |
            | --- | --- |
            | Device | `${{ needs.build.outputs.device }}` |
            | Kernel | `${{ needs.build.outputs.kernel_release }}` |
            | KernelSU | `${{ needs.build.outputs.ksu_name }}` @ `${{ needs.build.outputs.ksu_version }}` |
            | SUSFS | `${{ needs.build.outputs.susfs_version || 'not applied' }}` |

            Flash the AnyKernel3 zip from a custom recovery.

          files: release/*